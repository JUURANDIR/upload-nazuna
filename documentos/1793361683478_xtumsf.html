<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;padding:0;width:100%;height:620px;overflow:hidden;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;padding:8px}
#app{width:100%;max-width:760px;height:604px;display:flex;flex-direction:column;gap:8px}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px}
#title{font-size:20px;font-weight:800;letter-spacing:.3px}

.card{min-height:82px;text-align:left;background:#171b23;border:1px solid #2b3240;border-radius:16px;padding:13px}
.card .ico{font-size:27px;display:block;margin-bottom:5px}.card small{opacity:.65}

#info{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.9}
#game{width:100%;height:auto;aspect-ratio:16/9;max-height:500px;display:block;background:#10141b;border:1px solid #2b3240;border-radius:14px;image-rendering:auto;touch-action:none}#game.boardGame{aspect-ratio:17/12;height:auto;max-height:500px}

#touch button{padding:10px 4px;font-size:13px;background:#1a202a}
@media(min-width:600px){#menu{grid-template-columns:repeat(3,1fr)}#touch{max-width:500px;margin:auto;width:100%}}

<script>
(function(){
var c=document.getElementById('game'),x=c.getContext('2d'),menu=document.getElementById('menu'),wrap=document.getElementById('gameWrap'),back=document.getElementById('back'),nameEl=document.getElementById('gameName'),scoreEl=document.getElementById('score'),hint=document.getElementById('hint');
var W=c.width,H=c.height,keys={},downOnce={},game=null,raf=0,last=0,menuPage=1;
function resize(){W=c.width;H=c.height}
function resetKeys(){keys={};downOnce={}}
var keyMap={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',ArrowUp:'w',ArrowLeft:'a',ArrowDown:'s',ArrowRight:'d',Space:' '};
function normalizeKey(e){
  if(e&&keyMap[e.code]) return keyMap[e.code];
  var k=(e&&typeof e.key==='string')?e.key.toLowerCase():'';
  if(k==='arrowup')return 'w'; if(k==='arrowleft')return 'a'; if(k==='arrowdown')return 's'; if(k==='arrowright')return 'd';
  if(k===' ')return ' ';
  return ['w','a','s','d'].indexOf(k)>=0?k:null;
}
function handleKeyDown(e){var k=normalizeKey(e);if(!k)return;if(e.cancelable)e.preventDefault();if(!keys[k])downOnce[k]=true;keys[k]=true;}
function handleKeyUp(e){var k=normalizeKey(e);if(!k)return;if(e.cancelable)e.preventDefault();keys[k]=false;}
window.addEventListener('keydown',handleKeyDown,true);document.addEventListener('keydown',handleKeyDown,true);window.addEventListener('keyup',handleKeyUp,true);document.addEventListener('keyup',handleKeyUp,true);
window.addEventListener('keypress',handleKeyDown,true);

window.addEventListener('blur',resetKeys);
document.addEventListener('visibilitychange',function(){if(document.hidden)resetKeys()});
function setMenuPage(p){
  menuPage=p===4?4:(p===3?3:(p===2?2:1));
  document.querySelectorAll('#menu [data-page]').forEach(function(el){el.style.display=el.getAttribute('data-page')===String(menuPage)?'block':'none'});
  document.getElementById('page1').style.opacity=menuPage===1?'1':'.55';
  document.getElementById('page2').style.opacity=menuPage===2?'1':'.55';
  document.getElementById('page3').style.opacity=menuPage===3?'1':'.55';
  document.getElementById('page4').style.opacity=menuPage===4?'1':'.55';
  document.getElementById('title').textContent='🎮 Mini Arcade — Games '+menuPage;
}
document.getElementById('page1').addEventListener('click',function(){setMenuPage(1);resetKeys()});
document.getElementById('page2').addEventListener('click',function(){setMenuPage(2);resetKeys()});
document.getElementById('page3').addEventListener('click',function(){setMenuPage(3);resetKeys()});
document.getElementById('page4').addEventListener('click',function(){setMenuPage(4);resetKeys()});
setMenuPage(menuPage);
function focusGame(){try{document.body.tabIndex=0;document.body.focus({preventScroll:true});c.tabIndex=0;c.focus({preventScroll:true})}catch(e){}}
document.getElementById('game').addEventListener('pointerdown',focusGame);document.getElementById('app').addEventListener('pointerdown',focusGame);focusGame();
document.querySelectorAll('[data-key]').forEach(function(b){var k=b.getAttribute('data-key');function on(e){if(e&&e.cancelable)e.preventDefault();try{b.setPointerCapture&&e&&b.setPointerCapture(e.pointerId)}catch(_){ }if(!keys[k])downOnce[k]=true;keys[k]=true}function off(e){if(e&&e.cancelable)e.preventDefault();keys[k]=false;try{b.releasePointerCapture&&e&&b.releasePointerCapture(e.pointerId)}catch(_){ }}b.addEventListener('pointerdown',on,{passive:false});b.addEventListener('pointerup',off,{passive:false});b.addEventListener('pointercancel',off,{passive:false});b.addEventListener('pointerout',off,{passive:false});b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off,{passive:false});b.addEventListener('touchcancel',off,{passive:false})});
function once(k){var v=!!downOnce[k];delete downOnce[k];return v}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function text(t,y,size){x.fillStyle='#fff';x.font='bold '+size+'px Arial';x.textAlign='center';x.fillText(t,W/2,y);x.textAlign='left'}
function score(v){scoreEl.textContent='🏆 '+Math.floor(v)}
function over(msg){game.over=true;game.msg=msg||'GAME OVER';}
function bg(){x.fillStyle='#10141b';x.fillRect(0,0,W,H)}
function start(n){cancelAnimationFrame(raf);resetKeys();c.onclick=null;c.onpointerdown=null;c.classList.toggle('boardGame',n==='Xadrez'||n==='Dama'||n==='Ludo');if(n==='Xadrez'||n==='Dama'||n==='Ludo'){c.width=680;c.height=500;}else{c.width=720;c.height=405;}resize();game={name:n,over:false,msg:'',t:0,score:0};nameEl.textContent=n;menu.style.display='none';document.getElementById('pager').style.display='none';wrap.style.display='flex';back.style.display='block';
 if(n==='Dino Runner') initDino(); else if(n==='Snake') initSnake(); else if(n==='Sky Hopper') initFlappy(); else if(n==='Breakout') initBreakout(); else if(n==='Pong') initPong(); else if(n==='Space Shooter') initSpace(); else if(n==='Tetris') initTetris(); else if(n==='2048') init2048(); else if(n==='Asteroids') initAsteroids(); else if(n==='Space Invaders') initInvaders(); else if(n==='Memory') initMemory(); else if(n==='Minesweeper') initMinesweeper(); else if(n==='Frogger') initFrogger(); else if(n==='Whack-a-Mole') initWhack(); else if(n==='Pac-Man') initPacman(); else if(n==='Sokoban') initSokoban(); else if(n==='Connect Four') initConnect4(); else if(n==='Bomberman') initBomberman(); else if(n==='Galaga') initGalaga(); else if(n==='Xadrez') initChess(); else if(n==='Dama') initCheckers(); else if(n==='Ludo') initLudo(); else if(n==='Monopoly') initMonopoly(); else initDoodle();
 last=performance.now();try{c.tabIndex=0;c.focus({preventScroll:true})}catch(e){}raf=requestAnimationFrame(loop)}
function endFrame(){if(game.over){x.fillStyle='rgba(0,0,0,.58)';x.fillRect(0,0,W,H);text(game.msg,H/2-8,30);text('Espaço = reiniciar',H/2+30,16)}}
function loop(t){if(!game)return;var dt=Math.min(.033,(t-last)/1000);last=t;game.t+=dt;update(dt);draw();endFrame();downOnce={};raf=requestAnimationFrame(loop)}
function update(dt){if(game.over){if(once(' ')){start(game.name)}return}game.score=game.score||0;game.step(dt);score(game.score)}
function draw(){bg();game.paint()}

function initDino(){nameEl.textContent='🦖 Dino Runner';hint.textContent='W / ↑ / ␣ para pular • S / ↓ para abaixar';var ground=350,p={x:82,y:ground-48,w:44,h:48,vy:0,duck:false},obs=[],clouds=[],speed=6,dist=0,spawn=0,birdSpawn=0,birdMode=false;for(var i=0;i<5;i++)clouds.push({x:100+i*180,y:35+Math.random()*80,w:42+Math.random()*30});game.score=0;function hit(a,b){return a.x+5<b.x+b.w-5&&a.x+a.w-5>b.x+5&&a.y+4<b.y+b.h&&a.y+a.h-3>b.y}game.step=function(dt){if(game.over)return;if(once('w')||once(' ')){if(p.y>=ground-48){p.vy=-610}}p.duck=!!keys.s&&p.y>=ground-48;p.vy+=1800*dt;p.y+=p.vy*dt;if(p.y>ground-48){p.y=ground-48;p.vy=0}if(p.duck){p.h=28;p.y=ground-28}else{p.h=48;if(p.y>ground-48)p.y=ground-48}speed+=dt*.08;dist+=speed*dt*10;game.score=Math.floor(dist);spawn-=dt;if(spawn<=0){var h=28+Math.random()*35;obs.push({x:W+30,y:ground-h,w:18+Math.random()*24,h:h,type:'cactus'});spawn=.75+Math.random()*.85/(1+speed*.02)}birdSpawn-=dt;if(dist>450&&birdSpawn<=0){obs.push({x:W+40,y:ground-75,w:42,h:24,type:'bird',flap:0});birdSpawn=2.2+Math.random()*2.2}obs.forEach(function(o){o.x-=speed*55*dt;o.flap+=dt*8});obs=obs.filter(function(o){return o.x>-70});clouds.forEach(function(q){q.x-=speed*7*dt;if(q.x<-80)q.x=W+Math.random()*120});for(var i=0;i<obs.length;i++){var o=obs[i];if(hit(p,o))return over('🦖 GAME OVER')}if(game.score>0&&game.score%1000===0){} };game.paint=function(){x.fillStyle='#f7f7f7';x.fillRect(0,0,W,H);x.fillStyle='#777';clouds.forEach(function(q){x.fillRect(q.x,q.y,q.w,4);x.fillRect(q.x+8,q.y-5,18,8);x.fillRect(q.x+22,q.y-8,12,11)});x.fillStyle='#535353';x.fillRect(0,ground,W,3);x.fillStyle='#777';for(var i=0;i<18;i++)x.fillRect((i*67-(game.score*3)%67),ground+10,30,2);obs.forEach(function(o){if(o.type==='cactus'){x.fillStyle='#444';x.fillRect(o.x,o.y,o.w,o.h);x.fillRect(o.x-6,o.y+12,7,5);if(o.h>45)x.fillRect(o.x+o.w,o.y+22,7,5)}else{var f=Math.sin(o.flap)>0?0:6;x.fillStyle='#555';x.fillRect(o.x,o.y+f,42,12);x.fillRect(o.x+12,o.y-8+f,16,20);x.fillRect(o.x+28,o.y+f,10,5)}});x.fillStyle='#333';if(p.duck){x.fillRect(p.x,p.y+8,34,20);x.fillRect(p.x+28,p.y,18,14);x.fillRect(p.x+42,p.y+4,4,4)}else{x.fillRect(p.x,p.y+10,30,38);x.fillRect(p.x+24,p.y,22,22);x.fillRect(p.x+5,p.y+40,8,12);x.fillRect(p.x+23,p.y+40,8,12);x.fillStyle='#fff';x.fillRect(p.x+38,p.y+6,4,4)}x.fillStyle='#444';x.font='bold 18px monospace';x.textAlign='right';x.fillText(String(game.score).padStart(5,'0'),W-18,25);x.textAlign='left'} }
function initSnake(){nameEl.textContent='🐍 Snake';hint.textContent='WASD para mover • Espaço reinicia após perder';var cols=24,rows=13,cell=H/rows,s=[{x:8,y:6},{x:7,y:6},{x:6,y:6}],dir={x:1,y:0},next={x:1,y:0},food={x:15,y:5},acc=0;game.score=0;game.step=function(dt){if(keys.w&&dir.y===0)next={x:0,y:-1};if(keys.s&&dir.y===0)next={x:0,y:1};if(keys.a&&dir.x===0)next={x:-1,y:0};if(keys.d&&dir.x===0)next={x:1,y:0};acc+=dt;if(acc<.105)return;acc=0;dir=next;var h={x:s[0].x+dir.x,y:s[0].y+dir.y};if(h.x<0||h.x>=cols||h.y<0||h.y>=rows||s.some(function(q){return q.x===h.x&&q.y===h.y})){over('🐍 GAME OVER');return}s.unshift(h);if(h.x===food.x&&h.y===food.y){game.score+=10;food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}else s.pop()};game.paint=function(){x.fillStyle='#0d1712';x.fillRect(0,0,W,H);x.strokeStyle='#15251c';for(var i=0;i<=cols;i++){x.beginPath();x.moveTo(i*cell,0);x.lineTo(i*cell,H);x.stroke()}for(i=0;i<=rows;i++){x.beginPath();x.moveTo(0,i*cell);x.lineTo(W,i*cell);x.stroke()}x.fillStyle='#ff5b5b';x.fillRect(food.x*cell+4,food.y*cell+4,cell-8,cell-8);s.forEach(function(q,i){x.fillStyle=i?'#42d77d':'#a7ffbd';x.fillRect(q.x*cell+3,q.y*cell+3,cell-6,cell-6)})}}

function initFlappy(){nameEl.textContent='🐦 Sky Hopper';hint.textContent='Espaço para subir • toque no botão ␣';var py=H/2,vy=0,pipeX=W+80,gapY=170,gap=125,passed=false;game.score=0;game.step=function(dt){if(once(' '))vy=-420;vy+=1150*dt;py+=vy*dt;pipeX-=190*dt;if(pipeX<-70){pipeX=W+40;gapY=70+Math.random()*(H-210);passed=false}if(!passed&&pipeX<100){game.score++;passed=true}if(py<0||py+28>H|| (pipeX<125&&pipeX+65>85&&(py<gapY||py+28>gapY+gap)))over('🐦 GAME OVER')};game.paint=function(){x.fillStyle='#8fd7ff';x.fillRect(0,0,W,H);x.fillStyle='#65b84f';x.fillRect(0,H-30,W,30);x.fillStyle='#54b33e';x.fillRect(pipeX,0,65,gapY);x.fillRect(pipeX,gapY+gap,65,H-gapY-gap-30);x.fillStyle='#ffd447';x.beginPath();x.arc(105,py+14,14,0,Math.PI*2);x.fill();x.fillStyle='#222';x.fillRect(112,py+8,3,3);x.fillStyle='#ff8c32';x.fillRect(118,py+14,13,6)}}
